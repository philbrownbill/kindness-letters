name: Publish approved website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check launch settings
        run: node scripts/check-launch.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare GitHub preview
        run: |
          mkdir -p _preview
          cp -R site/. _preview/
          rm -f _preview/CNAME
      - name: Prepare local photograph and compatible preview paths
        run: node scripts/prepare-preview.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _preview
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
